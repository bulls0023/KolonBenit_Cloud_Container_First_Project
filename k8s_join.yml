---
# 워커 3대(WAS1 10.10.1.20, WAS2 10.10.1.22, DB 10.10.1.10)를 클러스터에 조인
# 사전 조건: k8s_init.yml 실행 완료, join-command.sh가
#           /home/ansible/ansible-lab/join-command.sh 에 저장되어 있어야 함
- hosts: 10.10.1.20,10.10.1.22,10.10.1.10
  serial: 1
  become: true
  tasks:
    - name: 이미 클러스터에 조인되어 있는지 확인
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: already_joined

    - name: join-command.sh를 워커 노드로 복사
      copy:
        src: /home/ansible/ansible-lab/join-command.sh
        dest: /root/join-command.sh
        mode: "0700"
      when: not already_joined.stat.exists

    - name: kubeadm join 실행
      command: bash /root/join-command.sh
      register: join_result
      when: not already_joined.stat.exists

    - name: join 결과 출력
      debug:
        msg: "{{ join_result.stdout_lines | default(['이미 조인되어 있어 스킵됨']) }}"

- hosts: 10.10.1.110
  become: true
  tasks:
    - name: 클러스터 노드 상태 확인
      command: kubectl --kubeconfig=/root/.kube/config get nodes -o wide
      register: node_status
      changed_when: false

    - name: 노드 상태 출력 (4대 전부 Ready인지 확인)
      debug:
        msg: "{{ node_status.stdout_lines }}"
