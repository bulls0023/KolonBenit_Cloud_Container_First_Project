<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처방전 — 해담의원</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  @media print {
    .topbar, .btn-row, .search-bar { display: none !important; }
    body { background: white; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">해담</span><span class="brand-sub">의원</span>
    </a>
    <nav class="topnav">
      <a href="/">홈</a>
      <a href="/reserve/step1">예약하기</a>
      <a href="/reserve/lookup">예약조회</a>
      <a href="/records">진료기록</a>
    </nav>
  </div>
</header>

<main class="flow-shell" style="max-width:680px;">
  <div class="list-header">
    <h1>처방전</h1>
    <p>진료기록에서 처방전을 선택하면 상세 내역이 표시됩니다</p>
  </div>

  <div class="search-bar">
    <input type="text" class="field-input" id="search-name" placeholder="환자 이름을 입력하세요 (예: 이영희)">
    <button class="btn btn-primary" onclick="search()">조회</button>
  </div>

  <div id="result"></div>
</main>

<script>
async function search() {
  const name = document.getElementById('search-name').value.trim();
  const result = document.getElementById('result');

  if (!name) {
    result.innerHTML = '<div class="empty-state">환자 이름을 입력해주세요</div>';
    return;
  }

  result.innerHTML = '<div class="empty-state">조회 중...</div>';

  try {
    const res = await fetch(`/api/prescriptions?patient_name=${encodeURIComponent(name)}`);
    const data = await res.json();

    if (!data.found) {
      result.innerHTML = `<div class="empty-state">‘${name}’의 처방전이 없습니다</div>`;
      return;
    }

    const dateFormatted = new Date(data.record.date).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

    result.innerHTML = `
      <div class="flow-card">
        <div class="record-top" style="margin-bottom:20px;">
          <h2 style="font-size:19px;">${name}님 처방전</h2>
          <span class="status-pill status-done">${data.record.diagnosis}</span>
        </div>
        <div class="summary-table" style="margin-top:0;">
          <div class="summary-row"><span class="k">진료일</span><span class="v">${dateFormatted}</span></div>
          <div class="summary-row"><span class="k">담당의</span><span class="v">${data.record.doctor} (${data.record.dept})</span></div>
        </div>

        <h3 style="margin:24px 0 12px; font-size:15px; font-weight:500;">처방 약품 (${data.drugs.length}건)</h3>
        ${data.drugs.map(d => `
          <div class="rx-card">
            <div class="rx-name">${d.name} <span style="color:var(--ink-soft); font-weight:400;">· ${d.dosage}</span></div>
            <div class="rx-meta">${d.usage} · ${d.duration}</div>
          </div>
        `).join('')}

        <div class="btn-row">
          <button class="btn btn-secondary" onclick="window.print()">처방전 출력</button>
          <a href="/records" class="btn btn-primary">진료기록으로</a>
        </div>
      </div>
    `;
  } catch (e) {
    result.innerHTML = '<div class="empty-state">조회 중 오류가 발생했습니다</div>';
  }
}

document.getElementById('search-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

// records.html에서 넘어온 경우 record 값으로 바로 조회
const recordParam = new URLSearchParams(window.location.search).get('record');
if (recordParam) {
  (async () => {
    const result = document.getElementById('result');
    result.innerHTML = '<div class="empty-state">조회 중...</div>';
    try {
      const res = await fetch(`/api/prescriptions?record_id=${recordParam}`);
      const data = await res.json();
      if (!data.found) {
        result.innerHTML = '<div class="empty-state">처방전을 찾을 수 없습니다</div>';
        return;
      }
      const dateFormatted = new Date(data.record.date).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
      result.innerHTML = `
        <div class="flow-card">
          <div class="record-top" style="margin-bottom:20px;">
            <h2 style="font-size:19px;">처방전</h2>
            <span class="status-pill status-done">${data.record.diagnosis}</span>
          </div>
          <div class="summary-table" style="margin-top:0;">
            <div class="summary-row"><span class="k">진료일</span><span class="v">${dateFormatted}</span></div>
            <div class="summary-row"><span class="k">담당의</span><span class="v">${data.record.doctor} (${data.record.dept})</span></div>
          </div>
          <h3 style="margin:24px 0 12px; font-size:15px; font-weight:500;">처방 약품 (${data.drugs.length}건)</h3>
          ${data.drugs.map(d => `
            <div class="rx-card">
              <div class="rx-name">${d.name} <span style="color:var(--ink-soft); font-weight:400;">· ${d.dosage}</span></div>
              <div class="rx-meta">${d.usage} · ${d.duration}</div>
            </div>
          `).join('')}
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="window.print()">처방전 출력</button>
            <a href="/records" class="btn btn-primary">진료기록으로</a>
          </div>
        </div>
      `;
    } catch (e) {
      result.innerHTML = '<div class="empty-state">조회 중 오류가 발생했습니다</div>';
    }
  })();
}
</script>

</body>
</html>
