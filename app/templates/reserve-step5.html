<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 완료 — 5/5</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">해담</span><span class="brand-sub">의원</span>
    </a>
    <nav class="topnav">
      <a href="/">홈</a>
      <a href="/reserve/step1">예약하기</a>
      <a href="/reserve/lookup">예약조회</a>
      <a href="/records">진료기록</a>
    </nav>
  </div>
</header>

<main class="flow-shell">
  <div class="stepper">
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">환자정보</span></div>
    <div class="step-line done"></div>
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">진료과</span></div>
    <div class="step-line done"></div>
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">의사선택</span></div>
    <div class="step-line done"></div>
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">날짜시간</span></div>
    <div class="step-line done"></div>
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">완료</span></div>
  </div>

  <div class="flow-card" style="text-align:center;">
    <div class="complete-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2>예약이 완료되었습니다</h2>
    <p class="flow-sub">예약번호로 추후 조회 및 취소가 가능합니다</p>

    <div class="reservation-code" id="res-code">—</div>

    <div class="summary-table" id="summary"></div>

    <div class="btn-row">
      <a href="/" class="btn btn-secondary">홈으로</a>
      <a href="/reserve/lookup" class="btn btn-primary">예약 조회하기</a>
    </div>
  </div>
</main>

<script>
const data = {
  name: sessionStorage.getItem('reservation_patient_name'),
  dept: sessionStorage.getItem('reservation_dept'),
  doctor: sessionStorage.getItem('reservation_doctor_name'),
  date: sessionStorage.getItem('reservation_date'),
  time: sessionStorage.getItem('reservation_time'),
};

if (!data.name || !data.doctor) {
  window.location.href = '/reserve/step1';
}

// DB에 실제로 INSERT된 예약번호 (step4에서 POST /api/appointments 응답으로 받음)
const code = sessionStorage.getItem('reservation_code') || '—';
document.getElementById('res-code').textContent = code;

const dateFormatted = new Date(data.date).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

document.getElementById('summary').innerHTML = `
  <div class="summary-row"><span class="k">환자명</span><span class="v">${data.name}</span></div>
  <div class="summary-row"><span class="k">진료과</span><span class="v">${data.dept}</span></div>
  <div class="summary-row"><span class="k">담당의</span><span class="v">${data.doctor}</span></div>
  <div class="summary-row"><span class="k">예약일시</span><span class="v">${dateFormatted} ${data.time}</span></div>
`;
</script>

</body>
</html>
