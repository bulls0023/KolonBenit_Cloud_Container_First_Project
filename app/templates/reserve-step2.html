<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진료과 선택 — 예약하기 2/5</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">해담</span><span class="brand-sub">의원</span>
    </a>
    <nav class="topnav">
      <a href="/">홈</a>
      <a href="/reserve/step1" class="active">예약하기</a>
      <a href="/reserve/lookup">예약조회</a>
      <a href="/records">진료기록</a>
    </nav>
  </div>
</header>

<main class="flow-shell">
  <div class="stepper">
    <div class="step-dot-wrap done"><div class="step-dot">✓</div><span class="step-label">환자정보</span></div>
    <div class="step-line done"></div>
    <div class="step-dot-wrap current"><div class="step-dot">2</div><span class="step-label">진료과</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">3</div><span class="step-label">의사선택</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">4</div><span class="step-label">날짜시간</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">5</div><span class="step-label">완료</span></div>
  </div>

  <div class="flow-card">
    <h2>어느 진료과를 찾으시나요</h2>
    <p class="flow-sub" id="patient-greeting">진료과를 선택하면 소속 의사 목록을 보여드립니다</p>

    <div class="option-grid">
      <label class="option-card" data-dept="내과">
        <input type="radio" name="dept">
        <div class="option-title">내과</div>
        <div class="option-desc">소화기 · 호흡기 · 일반 건강상담</div>
      </label>
      <label class="option-card" data-dept="외과">
        <input type="radio" name="dept">
        <div class="option-title">외과</div>
        <div class="option-desc">일반외과 · 외상 처치</div>
      </label>
      <label class="option-card" data-dept="정형외과">
        <input type="radio" name="dept">
        <div class="option-title">정형외과</div>
        <div class="option-desc">척추 · 관절 · 근골격계</div>
      </label>
      <label class="option-card" data-dept="피부과">
        <input type="radio" name="dept">
        <div class="option-title">피부과</div>
        <div class="option-desc">아토피 · 접촉성 피부염</div>
      </label>
    </div>

    <div class="btn-row">
      <a href="/reserve/step1" class="btn btn-secondary">이전</a>
      <button class="btn btn-primary" id="next-btn" onclick="goNext()" disabled>다음 단계</button>
    </div>
  </div>
</main>

<script>
const name = sessionStorage.getItem('reservation_patient_name');
if (name) {
  document.getElementById('patient-greeting').textContent = `${name}님, 진료과를 선택해주세요`;
} else {
  window.location.href = '/reserve/step1';
}

const cards = document.querySelectorAll('.option-card');
cards.forEach(card => {
  card.addEventListener('click', () => {
    cards.forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    card.querySelector('input').checked = true;
    document.getElementById('next-btn').disabled = false;
  });
});

function goNext() {
  const selected = document.querySelector('.option-card.selected');
  sessionStorage.setItem('reservation_dept', selected.dataset.dept);
  window.location.href = '/reserve/step3';
}
</script>

</body>
</html>
