<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환자 정보 — 예약하기 1/5</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">해담</span><span class="brand-sub">의원</span>
    </a>
    <nav class="topnav">
      <a href="/">홈</a>
      <a href="/reserve/step1" class="active">예약하기</a>
      <a href="/reserve/lookup">예약조회</a>
      <a href="/records">진료기록</a>
    </nav>
  </div>
</header>

<main class="flow-shell">
  <div class="stepper">
    <div class="step-dot-wrap current"><div class="step-dot">1</div><span class="step-label">환자정보</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">2</div><span class="step-label">진료과</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">3</div><span class="step-label">의사선택</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">4</div><span class="step-label">날짜시간</span></div>
    <div class="step-line"></div>
    <div class="step-dot-wrap"><div class="step-dot">5</div><span class="step-label">완료</span></div>
  </div>

  <div class="flow-card">
    <h2>환자분 성함을 알려주세요</h2>
    <p class="flow-sub">등록된 환자라면 자동으로 정보를 불러옵니다</p>

    <div class="field-group">
      <label class="field-label" for="patient-name">이름</label>
      <input type="text" id="patient-name" class="field-input" placeholder="예: 홍길동" oninput="handleNameInput()">
      <p class="field-hint" id="lookup-hint"></p>
    </div>

    <div id="new-patient-fields" style="display:none;">
      <div class="field-group">
        <label class="field-label" for="patient-birth">생년월일</label>
        <input type="date" id="patient-birth" class="field-input">
        <p class="field-hint">신규 환자 등록을 위해 필요합니다</p>
      </div>
    </div>

    <div class="btn-row">
      <a href="/" class="btn btn-secondary">취소</a>
      <button class="btn btn-primary" id="next-btn" onclick="goNext()" disabled>다음 단계</button>
    </div>
  </div>
</main>

<script>
let lookupTimer = null;
let currentPatientId = null;
let currentIsNew = false;

function handleNameInput() {
  const name = document.getElementById('patient-name').value.trim();
  const hint = document.getElementById('lookup-hint');
  const newFields = document.getElementById('new-patient-fields');
  const nextBtn = document.getElementById('next-btn');

  if (!name) {
    hint.textContent = '';
    newFields.style.display = 'none';
    nextBtn.disabled = true;
    return;
  }

  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(() => lookupPatient(name), 300);
}

async function lookupPatient(name) {
  const hint = document.getElementById('lookup-hint');
  const newFields = document.getElementById('new-patient-fields');
  const nextBtn = document.getElementById('next-btn');

  try {
    const res = await fetch(`/api/patients?name=${encodeURIComponent(name)}`);
    const data = await res.json();

    if (data.found) {
      currentPatientId = data.patient.patient_id;
      currentIsNew = false;
      hint.textContent = '등록된 환자 정보를 확인했습니다.';
      hint.style.color = 'var(--sage-deep)';
      newFields.style.display = 'none';
      nextBtn.disabled = false;
    } else {
      currentPatientId = null;
      currentIsNew = true;
      hint.textContent = '신규 환자입니다. 생년월일을 입력해주세요.';
      hint.style.color = 'var(--terracotta)';
      newFields.style.display = 'block';
      const birth = document.getElementById('patient-birth').value;
      nextBtn.disabled = !birth;
    }
  } catch (e) {
    hint.textContent = '환자 조회 중 오류가 발생했습니다.';
    hint.style.color = 'var(--terracotta)';
  }
}

document.getElementById('patient-birth').addEventListener('input', () => {
  const birth = document.getElementById('patient-birth').value;
  document.getElementById('next-btn').disabled = !birth;
});

async function goNext() {
  const name = document.getElementById('patient-name').value.trim();
  const nextBtn = document.getElementById('next-btn');
  nextBtn.disabled = true;

  try {
    if (currentIsNew) {
      const birth = document.getElementById('patient-birth').value;
      const res = await fetch('/api/patients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, birth_date: birth }),
      });
      const data = await res.json();
      currentPatientId = data.patient_id;
    }
    sessionStorage.setItem('reservation_patient_name', name);
    sessionStorage.setItem('reservation_patient_id', currentPatientId);
    window.location.href = '/reserve/step2';
  } catch (e) {
    alert('환자 등록 중 오류가 발생했습니다.');
    nextBtn.disabled = false;
  }
}
</script>

</body>
</html>
