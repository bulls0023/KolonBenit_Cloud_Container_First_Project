<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진료기록 — 해담의원</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">해담</span><span class="brand-sub">의원</span>
    </a>
    <nav class="topnav">
      <a href="/">홈</a>
      <a href="/reserve/step1">예약하기</a>
      <a href="/reserve/lookup">예약조회</a>
      <a href="/records" class="active">진료기록</a>
    </nav>
  </div>
</header>

<main class="flow-shell" style="max-width:760px;">
  <div class="list-header">
    <h1>진료기록</h1>
    <p>환자명을 입력하면 과거 진료 이력을 모두 확인할 수 있습니다</p>
  </div>

  <div class="search-bar">
    <input type="text" class="field-input" id="search-name" placeholder="환자 이름을 입력하세요 (예: 이영희)">
    <button class="btn btn-primary" onclick="search()">조회</button>
  </div>

  <div id="result-list"></div>
</main>

<script>
const PRESCRIPTION_URL = "/prescription";

async function search() {
  const name = document.getElementById('search-name').value.trim();
  const list = document.getElementById('result-list');

  if (!name) {
    list.innerHTML = '<div class="empty-state">환자 이름을 입력해주세요</div>';
    return;
  }

  list.innerHTML = '<div class="empty-state">조회 중...</div>';

  try {
    const res = await fetch(`/api/records?patient_name=${encodeURIComponent(name)}`);
    const results = await res.json();

    if (!results.length) {
      list.innerHTML = `<div class="empty-state">‘${name}’의 진료기록이 없습니다</div>`;
      return;
    }

    list.innerHTML = results.map(r => `
      <div class="record-card" id="rec-${r.id}" onclick="toggleDetail(${r.id})">
        <div class="record-top">
          <span class="record-date">${formatDate(r.date)}</span>
          <span class="status-pill status-done">${r.diagnosis}</span>
        </div>
        <div class="record-meta"><b>${r.dept}</b> · ${r.doctor} 선생님</div>
        <div class="detail-panel">
          <div class="detail-row"><span class="dk">증상</span><span>${r.symptoms}</span></div>
          <div class="detail-row"><span class="dk">소견</span><span>${r.diagnosis}으로 진단, 처방 진행</span></div>
          <a href="${PRESCRIPTION_URL}?record=${r.id}" class="btn btn-primary" style="display:inline-block;margin-top:10px;padding:10px 18px;" onclick="event.stopPropagation()">처방전 보기</a>
        </div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty-state">조회 중 오류가 발생했습니다</div>';
  }
}

function toggleDetail(id) {
  document.getElementById(`rec-${id}`).classList.toggle('open');
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

document.getElementById('search-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
</script>

</body>
</html>
