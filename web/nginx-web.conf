# WEB 노드(10.100.1.10, DMZ)에 설치되는 독립 nginx 설정
# K8s 클러스터 밖에서 동작하며, WAS1/WAS2의 NodePort(30080)로 리버스 프록시
#
# 배포 위치: /etc/nginx/sites-available/hospital.conf (또는 conf.d/hospital.conf)
# 적용: sudo ln -s /etc/nginx/sites-available/hospital.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

upstream was_backend {
    # WAS1, WAS2 각각의 NodePort. 두 노드 중 하나가 죽어도 나머지로 처리됨.
    server 10.10.1.20:30080 max_fails=3 fail_timeout=10s;
    server 10.10.1.22:30080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://was_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
